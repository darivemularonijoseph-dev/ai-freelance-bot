services:
  - type: web
    name: automatehyd-telugu-voice-agent
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python voice_agent_server.py
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: CHAT_ID
        sync: false
