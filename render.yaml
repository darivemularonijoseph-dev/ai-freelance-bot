services:
  - type: web
    name: antigravity-money-machine-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -u bot_listener_v2.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: CHAT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONIOENCODING
        value: "utf-8"
